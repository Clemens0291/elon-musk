<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>MONEY GAP</title>
    <style>
        body { background: #0a0a0a; color: #d4af37; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; }
        .particle { position: absolute; font-size: 20px; opacity: 0.2; pointer-events: none; animation: float linear infinite; }
        @keyframes float { 0% { transform: translateY(100vh); } 100% { transform: translateY(-10vh); } }
        .container { z-index: 1; width: 80%; max-width: 900px; background: rgba(20, 20, 20, 0.9); padding: 40px; border: 2px solid #d4af37; border-radius: 15px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.2); }
        h1 { text-align: center; color: #d4af37; text-transform: uppercase; letter-spacing: 3px; }
        .bar-wrap { margin: 30px 0; }
        .label { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; }
        .bar-bg { height: 30px; background: #000; border: 1px solid #d4af37; border-radius: 15px; overflow: hidden; }
        .bar { height: 100%; width: 0%; transition: width 0.1s linear; }
        #musk-bar { background: linear-gradient(90deg, #d4af37, #f7d560); }
        #avg-bar { background: linear-gradient(90deg, #2e7d32, #66bb6a); }
        .controls { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        button { padding: 12px 30px; cursor: pointer; background: transparent; border: 1px solid #d4af37; color: #d4af37; border-radius: 5px; transition: 0.3s; }
        button:hover { background: #d4af37; color: #000; }
        #diff { text-align: center; margin-top: 20px; color: #888; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div id="particles"></div>
    <div class="container">
        <h1>MONEY GAP</h1>
        <div class="bar-wrap">
            <div class="label"><span>Elon Musk</span><span id="musk-val">0 $</span></div>
            <div class="bar-bg"><div id="musk-bar" class="bar"></div></div>
        </div>
        <div class="bar-wrap">
            <div class="label"><span>Durchschnitt</span><span id="avg-val">0 €</span></div>
            <div class="bar-bg"><div id="avg-bar" class="bar"></div></div>
        </div>
        <div id="diff">Unterschied: Faktor 2.615.289</div>
        <div class="controls">
            <button onclick="start()">START</button>
            <button onclick="pause()">PAUSE</button>
            <button onclick="reset()">RESET</button>
        </div>
        <div class="bar-wrap" style="height: 20px; margin-top: 40px; position: relative;">
            <div id="timeline" class="bar-bg" style="height: 100%; position: relative;">
                <div id="time-marker" style="width: 2px; height: 100%; background: #fff; position: absolute; left: 0%; z-index: 2;"></div>
                <div id="markers" style="display: flex; justify-content: space-between; padding: 0 5px; color: #d4af37; font-size: 12px; font-weight: bold; line-height: 20px;">
                    <span>0</span><span>5</span><span>10</span><span>15</span><span>20</span><span>25</span><span>30</span><span>35</span><span>40</span><span>45</span><span>50</span><span>55</span><span>60</span>
                </div>
            </div>
        </div>
    </div>
    <script>
        const symbols = ['$', '€', '💸', '💰'];
        for(let i=0; i<30; i++) {
            let p = document.createElement('div');
            p.className = 'particle';
            p.innerText = symbols[Math.floor(Math.random()*symbols.length)];
            p.style.left = Math.random()*100 + '%';
            p.style.animationDuration = (Math.random()*5+5) + 's';
            document.getElementById('particles').appendChild(p);
        }
        let startT, elapsed = 0, raf, running = false;
        const muskPerSec = 5021.53, avgPerSec = 0.00192;
        function update(t) {
            if (!startT) startT = t - elapsed;
            elapsed = t - startT;
            let mVal = elapsed * muskPerSec, aVal = elapsed * avgPerSec;
            document.getElementById('musk-val').innerText = Math.round(mVal).toLocaleString() + ' $';
            document.getElementById('avg-val').innerText = Math.round(aVal).toLocaleString() + ' €';
            document.getElementById('musk-bar').style.width = (Math.log10(mVal + 1) / 12) * 100 + '%';
            document.getElementById('avg-bar').style.width = (Math.log10(aVal + 1) / 12) * 100 + '%';
            
            let progress = Math.min((elapsed / 1000) / 60 * 100, 100);
            document.getElementById('time-marker').style.left = progress + '%';
            
            if (elapsed < 60000) {
                raf = requestAnimationFrame(update);
            } else {
                running = false;
            }
        }
        function start() { if (!running) { running = true; raf = requestAnimationFrame(update); } }
        function pause() { running = false; cancelAnimationFrame(raf); startT = null; }
        function reset() { pause(); elapsed = 0; document.getElementById('musk-val').innerText = '0 $'; document.getElementById('avg-val').innerText = '0 €'; document.getElementById('musk-bar').style.width = '0%'; document.getElementById('avg-bar').style.width = '0%'; }
        window.addEventListener('keydown', (e) => { if (e.code === 'Space') start(); });
    </script>
</body>
</html>
